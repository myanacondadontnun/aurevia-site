[images]
  remote_images = ["https://source.unsplash.com/.*", "https://images.unsplash.com/.*", "https://ext.same-assets.com/.*", "https://ugc.same-assets.com/.*"]

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# Pixel & Code's chat widget calls this clean path; proxied (status 200, not a
# redirect) to the actual function so the browser URL stays /pixel-and-code/api/chat.
[[redirects]]
  from = "/pixel-and-code/api/chat"
  to = "/.netlify/functions/pixel-chat"
  status = 200
# Homepage lead form posts here; same proxy pattern as the chat.
[[redirects]]
  from = "/pixel-and-code/api/lead"
  to = "/.netlify/functions/pixel-lead"
  status = 200

# Retired product pages (capabilities that never shipped) and the old docs page.
[[redirects]]
  from = "/products/multilingual/*"
  to = "/products/"
  status = 301
  force = true
[[redirects]]
  from = "/products/api/*"
  to = "/products/"
  status = 301
  force = true
[[redirects]]
  from = "/resources/docs/*"
  to = "/help/"
  status = 301
  force = true

# Consolidated / retired pages (site audit 2026-09-26).
[[redirects]]
  from = "/products/analytics/*"
  to = "/products/roi-tracking/"
  status = 301
  force = true
[[redirects]]
  from = "/solutions/insights/*"
  to = "/products/roi-tracking/"
  status = 301
  force = true
[[redirects]]
  from = "/solutions/stories/*"
  to = "/solutions/"
  status = 301
  force = true
[[redirects]]
  from = "/solutions/industries/*"
  to = "/solutions/#industries"
  status = 301
  force = true
[[redirects]]
  from = "/pixel-and-code/shopify-brand-building/*"
  to = "/pixel-and-code/"
  status = 301
  force = true
