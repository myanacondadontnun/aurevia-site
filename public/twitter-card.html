<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  body { margin: 0; background: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .card {
    width: 1200px; height: 600px;
    position: relative; overflow: hidden;
    border-radius: 20px;
    font-family: 'Space Grotesk', sans-serif;
  }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .content {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: space-between;
    padding: 52px 64px;
    box-sizing: border-box;
  }
  .top { display: flex; align-items: center; gap: 12px; }
  .logo-img { height: 36px; width: auto; display: block; }
  .brand-name {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 22px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.92);
    text-transform: uppercase;
  }
  .middle { flex: 1; display: flex; flex-direction: column; justify-content: center; }
  .divider { width: 40px; height: 1px; background: rgba(42,255,185,0.5); margin-bottom: 28px; }
  .tagline {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 300;
    font-size: 52px;
    line-height: 1.15;
    color: rgba(255,255,255,0.95);
    letter-spacing: 0.01em;
    max-width: 680px;
  }
  .tagline span { color: #2AFFB9; }
  .bottom { display: flex; align-items: center; justify-content: space-between; }
  .url {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 12px;
    letter-spacing: 0.18em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
  }
  .shopify-block {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .shopify-label {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 300;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: rgba(255,255,255,0.4);
    text-transform: uppercase;
    text-align: right;
    line-height: 1.6;
  }
  .shopify-img { height: 30px; width: auto; display: block; opacity: 0.88; object-fit: contain; }
</style>
</head>
<body>
<div class="card">
  <canvas id="c" width="1200" height="600" aria-hidden="true"></canvas>
  <div class="content">
    <div class="top">
      <img class="logo-img" src="/images/aurevia-logo-mark.png" width="120" height="36" alt="Aurevia">
      <span class="brand-name">Aurevia</span>
    </div>
    <div class="middle">
      <div class="divider"></div>
      <div class="tagline">AI Sales Agent to convert<br>your visitors <span>24/7</span></div>
    </div>
    <div class="bottom">
      <span class="url">aurevia.io</span>
      <div class="shopify-block">
        <span class="shopify-label">Official Shopify Partner<br>Approved</span>
        <img class="shopify-img" src="/images/shopify-partner-mark.png" width="26" height="30" alt="Shopify Partner">
      </div>
    </div>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 1200; canvas.height = 600;

function draw() {
  ctx.clearRect(0, 0, 1200, 600);
  const base = ctx.createLinearGradient(0, 0, 1200, 600);
  base.addColorStop(0, '#010f0a');
  base.addColorStop(0.5, '#020e0b');
  base.addColorStop(1, '#010a07');
  ctx.fillStyle = base;
  ctx.fillRect(0, 0, 1200, 600);

  const orb1 = ctx.createRadialGradient(900, 280, 0, 900, 280, 480);
  orb1.addColorStop(0, 'rgba(15,110,86,0.38)');
  orb1.addColorStop(0.35, 'rgba(8,80,65,0.22)');
  orb1.addColorStop(0.7, 'rgba(4,52,44,0.1)');
  orb1.addColorStop(1, 'rgba(1,10,7,0)');
  ctx.fillStyle = orb1;
  ctx.fillRect(0, 0, 1200, 600);

  const orb2 = ctx.createRadialGradient(1050, 80, 0, 1050, 80, 320);
  orb2.addColorStop(0, 'rgba(42,255,185,0.07)');
  orb2.addColorStop(0.4, 'rgba(29,158,117,0.05)');
  orb2.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = orb2;
  ctx.fillRect(0, 0, 1200, 600);

  const orb3 = ctx.createRadialGradient(620, 520, 0, 620, 520, 200);
  orb3.addColorStop(0, 'rgba(15,110,86,0.12)');
  orb3.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = orb3;
  ctx.fillRect(0, 0, 1200, 600);

  for (let i = 0; i < 6; i++) {
    const x = 500 + i * 120;
    const y = 100 + i * 40;
    const wg = ctx.createLinearGradient(x, y, x + 200, y + 300);
    wg.addColorStop(0, 'rgba(8,80,65,0.0)');
    wg.addColorStop(0.3, 'rgba(8,80,65,0.06)');
    wg.addColorStop(0.6, 'rgba(4,52,44,0.04)');
    wg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = wg;
    ctx.beginPath();
    ctx.ellipse(x + 100, y + 150, 80 + i * 20, 200 + i * 15, Math.PI * 0.15 * i, 0, Math.PI * 2);
    ctx.fill();
  }

  const vig = ctx.createRadialGradient(600, 300, 200, 600, 300, 700);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.55)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, 1200, 600);
}
draw();
</script>
</body>
</html>
